[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apidiff"
version = "0.1.0"
description = "Detect breaking changes between two OpenAPI specs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/apidiff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]